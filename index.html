<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Afiliado</title>
    <style>
        :root { --ml-yellow: #ffe600; --ml-bg: #ebebeb; --ml-text: #333333; --ml-text-light: #666666; --ml-blue: #3483fa; --ml-green: #00a650; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background-color: var(--ml-bg); color: var(--ml-text); }
        
        header { background-color: var(--ml-yellow); padding: 8px 10px; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .header-content { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
        .logo-img { height: 45px; }
        .search-bar { background: #fff; padding: 10px 15px; border-radius: 2px; box-shadow: 0 1px 2px 0 rgba(0,0,0,.2); font-size: 16px; color: #999; }
        
        main { max-width: 1200px; margin: 0 auto; padding: 20px 10px 80px 10px; }
        h2 { font-size: 24px; font-weight: 400; margin-bottom: 24px; color: var(--ml-text-light); }
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .product-card { background: #fff; border-radius: 4px; overflow: hidden; box-shadow: 0 1px 2px 0 rgba(0,0,0,.12); cursor: pointer; }
        .product-card:hover { box-shadow: 0 7px 16px 0 rgba(0,0,0,.1); }
        .img-wrapper { width: 100%; aspect-ratio: 1; position: relative; border-bottom: 1px solid #eee; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: contain; padding: 15px; }
        .hover-desc { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(52, 131, 250, 0.95); color: #fff; padding: 20px; font-size: 14px; display: flex; align-items: center; justify-content: center; text-align: center; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .product-card:hover .hover-desc { opacity: 1; }
        .info { padding: 12px 16px; }
        .price { font-size: 24px; }
        .frete { color: var(--ml-green); font-size: 14px; font-weight: 600; }
        .title { font-size: 14px; color: var(--ml-text-light); margin-top: 4px; }
        
        .float-btn { position: fixed; width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 1000; cursor: pointer; border: none; }
        .btn-admin { bottom: 20px; left: 20px; background: #fff; color: #666; }
        .btn-tiktok { bottom: 20px; right: 20px; background: #000; color: #fff; text-decoration: none; }
        .float-btn svg { width: 24px; height: 24px; fill: currentColor; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #fff; border-radius: 8px; padding: 30px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: #666; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        button { background: #3483fa; color: white; border: none; border-radius: 6px; padding: 12px 20px; font-weight: 600; cursor: pointer; width: 100%; font-size: 15px; }
        .btn-secondary { background: #f0f0f0; color: #333; margin-top: 10px; }
        .btn-remover { background: #ffe6e6; color: #cc0000; width: auto; padding: 8px 12px; font-size: 12px; }
        .item-produto { display: flex; align-items: center; justify-content: space-between; padding: 15px; border: 1px solid #eee; border-radius: 6px; margin-bottom: 10px; }
        .item-info { display: flex; align-items: center; gap: 15px; flex: 1; }
        .item-info img { width: 60px; height: 60px; object-fit: contain; border-radius: 4px; }
        .item-detalhes h4 { font-size: 14px; margin-bottom: 4px; }
        .item-detalhes p { font-size: 13px; color: #00a650; font-weight: 600; }
        
        @media (min-width: 768px) { 
            .header-content { flex-direction: row; align-items: center; } 
            .search-bar { flex: 1; margin-left: 30px; } 
            .products-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } 
        }
        @media (min-width: 1024px) { 
            .products-grid { grid-template-columns: repeat(5, 1fr); } 
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <img src="https://logopng.com.br/logos/mercado-livre-87.svg?dpl=dpl_83xWKUBiCCc88zqvgK1XNSG8JXgj" alt="Mercado Livre" class="logo-img">
            <div class="search-bar">Buscar produtos, marcas e muito mais…</div>
        </div>
    </header>

    <main>
        <h2>Baseado na sua última visita</h2>
        <div class="products-grid" id="produtos">
            <p style="grid-column: 1/-1; text-align: center;">Carregando produtos...</p>
        </div>
    </main>

    <!-- Modal Admin -->
    <div class="modal-overlay" id="modalAdmin">
        <div class="modal">
            <h3>Painel de Controle</h3>
            
            <div id="login-area">
                <div class="form-group">
                    <label>Senha de Acesso</label>
                    <input type="password" id="senha" placeholder="Digite sua senha">
                </div>
                <button onclick="entrar()">Acessar Painel</button>
            </div>
            
            <div id="admin-area" style="display: none;">
                <h3 style="font-size: 16px; margin-top: 20px;">Adicionar Novo Produto</h3>
                <form id="form-add" onsubmit="adicionar(event)">
                    <div class="form-group">
                        <label>Nome do Produto</label>
                        <input type="text" id="nome" required placeholder="Ex: Smartphone Samsung...">
                    </div>
                    <div class="form-group">
                        <label>Descrição</label>
                        <textarea id="descricao" rows="3" required placeholder="Fale sobre os benefícios..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Valor Exato (R$)</label>
                        <input type="number" step="0.01" id="valor" required placeholder="Ex: 1599.90">
                    </div>
                    <div class="form-group">
                        <label>Link de Afiliado (URL)</label>
                        <input type="url" id="link" required placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>Link da Imagem (URL)</label>
                        <input type="url" id="imagem" required placeholder="https://...">
                    </div>
                    <button type="submit">Cadastrar Produto</button>
                </form>
                
                <h3 style="font-size: 16px; margin-top: 30px;">Produtos Cadastrados</h3>
                <div id="lista-produtos"></div>
                
                <button class="btn-secondary" onclick="fecharModal()">Fechar Painel</button>
            </div>
        </div>
    </div>

    <!-- Botões Flutuantes -->
    <button class="float-btn btn-admin" onclick="abrirModal()">
        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
    </button>
    <a href="https://tiktok.com/@shuler.o.gato" class="float-btn btn-tiktok" target="_blank">
        <svg viewBox="0 0 448 512"><path d="M448 209.9a210.1 210.1 0 0 1 -122.8-39.3V349.4A162.6 162.6 0 1 1 185 188.3V278.2a74.6 74.6 0 1 0 52.2 71.2V0l88 0a121.2 121.2 0 0 0 1.9 22.2h0A122.2 122.2 0 0 0 381 102.4a121.4 121.4 0 0 0 67 20.1z"/></svg>
    </a>

    <script>
        // ====== CONFIGURAÇÃO: EDITE SEUS PRODUTOS AQUI ======
        const PRODUTOS_INICIAIS = [
            {
                id: "1",
                nome: "Smartphone Samsung Galaxy S24",
                descricao: "O melhor smartphone do momento com câmera de 200MP",
                valor: 4999.90,
                link: "https://seu-link-afiliado.com/produto1",
                imagem: "https://images.samsung.com/br/smartphones/galaxy-s24/images/galaxy-s24-share-image.jpg"
            },
            {
                id: "2",
                nome: "Notebook Dell Inspiron 15",
                descricao: "Notebook potente para trabalho e estudos",
                valor: 3499.90,
                link: "https://seu-link-afiliado.com/produto2",
                imagem: "https://i.dell.com/is/image/DellContent/content/dam/ss2/product-images/dell-client-products/notebooks/inspiron-notebooks/15-3520/media-gallery/peripherals_laptop_latam_inspiron_15_3520_gallery_1.psd?fmt=png-alpha&pscan=auto&scl=1"
            },
            {
                id: "3",
                nome: "Fone de Ouvido Bluetooth JBL",
                descricao: "Som incrível com graves potentes",
                valor: 299.90,
                link: "https://seu-link-afiliado.com/produto3",
                imagem: "https://http2.mlstatic.com/D_NQ_NP_2X_789123-MLB54865412345_052023-F.webp"
            }
        ];
        // ====== FIM DA CONFIGURAÇÃO ======
        
        // Chave única para este site (não precisa mudar)
        const STORAGE_KEY = 'produtos_afiliados_globais_v1';
        
        function formatarPreco(valor) {
            return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }
        
        function carregarProdutos() {
            const container = document.getElementById('produtos');
            const produtos = obterProdutos();
            
            container.innerHTML = '';
            
            if (produtos.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Nenhum produto cadastrado.</p>';
                return;
            }
            
            produtos.slice().reverse().forEach((p) => {
                container.innerHTML += `
                    <div class="product-card" onclick="window.open('${p.link}', '_blank')">
                        <div class="img-wrapper">
                            <img src="${p.imagem}" alt="${p.nome}" onerror="this.src='https://via.placeholder.com/300x300?text=Sem+Imagem'">
                            <div class="hover-desc">${p.descricao}</div>
                        </div>
                        <div class="info">
                            <span class="price">${formatarPreco(p.valor)}</span>
                            <span class="frete">Frete grátis</span>
                            <span class="title">${p.nome}</span>
                        </div>
                    </div>
                `;
            });
        }
        
        function obterProdutos() {
            const dados = localStorage.getItem(STORAGE_KEY);
            if (dados) {
                return JSON.parse(dados);
            }
            // Se não houver dados, usa os produtos iniciais
            localStorage.setItem(STORAGE_KEY, JSON.stringify(PRODUTOS_INICIAIS));
            return PRODUTOS_INICIAIS;
        }
        
        function abrirModal() {
            document.getElementById('modalAdmin').classList.add('active');
        }
        
        function fecharModal() {
            document.getElementById('modalAdmin').classList.remove('active');
            document.getElementById('login-area').style.display = 'block';
            document.getElementById('admin-area').style.display = 'none';
            document.getElementById('senha').value = '';
        }
        
        function entrar() {
            const senha = document.getElementById('senha').value;
            if (senha === 'marcus') {
                document.getElementById('login-area').style.display = 'none';
                document.getElementById('admin-area').style.display = 'block';
                carregarListaAdmin();
            } else {
                alert('Acesso negado. Senha incorreta.');
            }
        }
        
        function adicionar(e) {
            e.preventDefault();
            
            const novo = {
                id: Date.now().toString(),
                nome: document.getElementById('nome').value,
                descricao: document.getElementById('descricao').value,
                valor: parseFloat(document.getElementById('valor').value),
                link: document.getElementById('link').value,
                imagem: document.getElementById('imagem').value
            };
            
            const produtos = obterProdutos();
            produtos.push(novo);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(produtos));
            
            e.target.reset();
            carregarListaAdmin();
            carregarProdutos();
            alert("Produto salvo com sucesso!");
        }
        
        function remover(id) {
            if (confirm('Tem certeza que deseja apagar este produto?')) {
                let produtos = obterProdutos();
                produtos = produtos.filter(p => p.id !== id);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(produtos));
                carregarListaAdmin();
                carregarProdutos();
            }
        }
        
        function carregarListaAdmin() {
            const container = document.getElementById('lista-produtos');
            const produtos = obterProdutos();
            
            if (produtos.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999;">Nenhum produto cadastrado.</p>';
                return;
            }
            
            container.innerHTML = '';
            
            produtos.slice().reverse().forEach((p) => {
                container.innerHTML += `
                    <div class="item-produto">
                        <div class="item-info">
                            <img src="${p.imagem}" alt="Produto" onerror="this.src='https://via.placeholder.com/60x60?text=Sem+Imagem'">
                            <div class="item-detalhes">
                                <h4>${p.nome}</h4>
                                <p>${formatarPreco(p.valor)}</p>
                            </div>
                        </div>
                        <button class="btn-remover" onclick="remover('${p.id}')">Remover</button>
                    </div>
                `;
            });
        }
        
        document.getElementById('modalAdmin').addEventListener('click', function(e) {
            if (e.target === this) {
                fecharModal();
            }
        });
        
        // Carregar produtos ao iniciar
        carregarProdutos();
    </script>
</body>
</html>
