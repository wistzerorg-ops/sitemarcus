<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Afiliado</title>
    <style>
        /* Variáveis e Fontes Oficiais */
        :root {
            --ml-yellow: #ffe600;
            --ml-bg: #ebebeb;
            --ml-text: #333333;
            --ml-text-light: #666666;
            --ml-blue: #3483fa;
            --ml-green: #00a650;
        }
        
        @font-face {
            font-family: 'Proxima Nova';
            src: local('Proxima Nova'), local('Arial');
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: "Proxima Nova", -apple-system, "Helvetica Neue", Helvetica, Roboto, Arial, sans-serif; 
            background-color: var(--ml-bg); 
            color: var(--ml-text); 
            -webkit-font-smoothing: antialiased;
        }

        /* Cabeçalho Mercado Livre */
        header {
            background-color: var(--ml-yellow);
            padding: 8px 10px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        .logo-img {
            height: 60px;
        }

        .search-bar {
            background: #fff;
            padding: 10px 15px;
            border-radius: 2px;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,.2);
            font-size: 16px;
            color: #999;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Grid e Container Principal */
        main { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px 10px 80px 10px; 
        }

        h2 { 
            font-size: 24px; 
            font-weight: 400; 
            margin-bottom: 24px; 
            color: var(--ml-text-light); 
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        /* Card do Produto */
        .product-card {
            background: #fff;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,.12);
            position: relative;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(40px);
            transition: box-shadow 0.3s ease-out, transform 0.3s ease-out;
            cursor: pointer;
        }

        .product-card:hover {
            box-shadow: 0 7px 16px 0 rgba(0,0,0,.1);
        }

        .product-card.show {
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Imagem e Hover de Descrição */
        .img-wrapper {
            width: 100%;
            aspect-ratio: 1;
            position: relative;
            border-bottom: 1px solid #eee;
            overflow: hidden;
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 15px;
            background: #fff;
        }

        .hover-desc {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(52, 131, 250, 0.95);
            color: #fff;
            padding: 20px;
            font-size: 14px;
            line-height: 1.4;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .product-card:hover .hover-desc {
            opacity: 1;
        }

        /* Informações do Produto */
        .info {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .price {
            font-size: 24px;
            font-weight: 400;
            color: var(--ml-text);
        }

        .frete {
            color: var(--ml-green);
            font-size: 14px;
            font-weight: 600;
        }

        .title {
            font-size: 14px;
            color: var(--ml-text-light);
            font-weight: 400;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 4px;
        }

        /* Botões Flutuantes (Admin e TikTok) */
        .float-btn {
            position: fixed;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
            text-decoration: none;
            transition: transform 0.2s;
        }
        
        .float-btn:hover { transform: scale(1.1); }

        .btn-admin {
            bottom: 20px;
            left: 20px;
            background: #fff;
            color: #666;
        }

        .btn-tiktok {
            bottom: 20px;
            right: 20px;
            background: #000;
            color: #fff;
        }

        .float-btn svg { width: 24px; height: 24px; fill: currentColor; }

        /* Responsivo: Tablet e PC */
        @media (min-width: 768px) {
            .header-content {
                flex-direction: row;
                align-items: center;
            }
            .search-bar {
                flex: 1;
                margin-left: 30px;
            }
            .products-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 16px;
            }
        }
        @media (min-width: 1024px) {
            .products-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo-container">
                <!-- Logo Oficial do Mercado Livre em SVG -->
                <img src="https://logopng.com.br/logos/mercado-livre-87.svg?dpl=dpl_83xWKUBiCCc88zqvgK1XNSG8JXgj" alt="Mercado Livre Logo@clipartmax.com" alt="Mercado Livre" class="logo-img">
            </div>
            <div class="search-bar">
                Buscar produtos, marcas e muito mais…
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#999"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </div>
        </div>
    </header>

    <main>
        <h2>Baseado na sua última visita</h2>
        <div class="products-grid" id="produtos">
            <!-- Produtos renderizados aqui via JS -->
        </div>
    </main>

    <!-- Cadeado para o Admin (Canto Esquerdo) -->
    <a href="admin.html" class="float-btn btn-admin" title="Painel Admin">
        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
    </a>

    <!-- TikTok (Canto Direito) -->
    <a href="https://tiktok.com/@shuler.o.gato" class="float-btn btn-tiktok" target="_blank" title="TikTok">
        <svg viewBox="0 0 448 512"><path d="M448 209.9a210.1 210.1 0 0 1 -122.8-39.3V349.4A162.6 162.6 0 1 1 185 188.3V278.2a74.6 74.6 0 1 0 52.2 71.2V0l88 0a121.2 121.2 0 0 0 1.9 22.2h0A122.2 122.2 0 0 0 381 102.4a121.4 121.4 0 0 0 67 20.1z"/></svg>
    </a>

    <script>
        function formatarPreco(valor) {
            return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function carregarProdutos() {
            const container = document.getElementById('produtos');
            const lista = JSON.parse(localStorage.getItem('ml_produtos')) || [];

            if (lista.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; color: #999; text-align: center; margin-top: 20px;">Nenhum produto cadastrado.</p>';
                return;
            }

            container.innerHTML = '';
            lista.forEach((p, index) => {
                // Ao clicar na imagem/card, abre o link
                container.innerHTML += `
                    <div class="product-card" onclick="window.open('${p.link}', '_blank')" style="animation-delay: ${index * 0.1}s">
                        <div class="img-wrapper">
                            <img src="${p.imagem}" alt="${p.nome}">
                            <div class="hover-desc">${p.descricao}</div>
                        </div>
                        <div class="info">
                            <span class="price">${formatarPreco(p.valor)}</span>
                            <span class="frete">Frete grátis</span>
                            <span class="title">${p.nome}</span>
                        </div>
                    </div>
                `;
            });

            iniciarAnimacaoScroll();
        }

        function iniciarAnimacaoScroll() {
            const cards = document.querySelectorAll('.product-card');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('show');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.05 });

            cards.forEach(card => observer.observe(card));
        }

        document.addEventListener('DOMContentLoaded', carregarProdutos);
    </script>
</body>
</html>
