<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prova Final - 50 Questões - GUGU Estudos</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --panel: #14141c;
            --card: #1c1c26;
            --primary: #7c3aed;
            --primary-hover: #8b5cf6;
            --accent: #06b6d4;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --border: #2d2d3d;
            --success: #10b981;
            --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            line-height: 1.7;
            padding: 40px 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .header p { color: var(--muted); font-size: 1.1rem; margin-top: 10px; }
        .watermark {
            position: fixed; bottom: 20px; right: 20px; font-size: 4rem;
            font-weight: 900; color: rgba(124, 58, 237, 0.06);
            pointer-events: none; transform: rotate(-15deg); z-index: 0;
            letter-spacing: 5px;
        }
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 15px;
        }
        .info-bar span {
            color: var(--muted);
            font-size: 0.95rem;
        }
        .info-bar strong {
            color: var(--primary);
        }
        .question {
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
            transition: 0.3s;
        }
        .question:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.15);
        }
        .question p {
            font-weight: 600;
            margin-bottom: 18px;
            color: var(--text);
            font-size: 1rem;
            text-align: left;
        }
        .question-number {
            display: inline-block;
            background: var(--primary);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            text-align: center;
            line-height: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-right: 10px;
        }
        .options label {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 16px;
            background: #1f1f2a;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid transparent;
            font-size: 0.95rem;
            color: var(--muted);
        }
        .options label:hover {
            background: #2a2a3a;
            border-color: var(--border);
            color: var(--text);
        }
        .options input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #6b7280;
            border-radius: 50%;
            margin-top: 2px;
            flex-shrink: 0;
            transition: 0.3s;
            position: relative;
            cursor: pointer;
        }
        .options input[type="radio"]:checked {
            border-color: var(--primary);
            background: var(--primary);
            box-shadow: inset 0 0 0 3px var(--card);
        }
        .options label:has(input:checked) {
            background: rgba(124, 58, 237, 0.15);
            border-color: var(--primary);
            color: var(--text);
        }
        .btn-submit {
            width: 100%;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), #6d28d9);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
            letter-spacing: 0.5px;
            font-family: inherit;
        }
        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
            filter: brightness(1.1);
        }
        .btn-reset {
            width: 100%;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            background: transparent;
            color: var(--muted);
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            font-family: inherit;
        }
        .btn-reset:hover {
            border-color: var(--danger);
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }
        #result-box {
            margin-top: 30px;
            padding: 30px;
            background: var(--card);
            border-radius: 12px;
            text-align: center;
            display: none;
            border: 2px solid var(--border);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #result-box.pass {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }
        #result-box.fail {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }
        #result-box h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        #result-box .score {
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #result-box .feedback {
            color: var(--muted);
            font-size: 1rem;
            max-width: 500px;
            margin: 0 auto;
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
        }
        .back-link:hover { background: var(--primary-hover); transform: translateY(-2px); }
        @media (max-width: 768px) {
            .header h1 { font-size: 1.6rem; }
            body { padding: 20px 15px; }
            .watermark { font-size: 2rem; }
            .question { padding: 18px; }
            .question p { font-size: 0.9rem; }
            .options label { padding: 12px; font-size: 0.85rem; }
            .info-bar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>

                materia: "Atualidades",
                pergunta: "O que é a Amazônia Legal?",
                opcoes: ["Uma área de proteção ambiental internacional.", "Um conceito sociopolítico que abrange 8 estados brasileiros e parte do Maranhão.", "A região que compreende apenas o bioma Amazônia.", "Uma ONG de defesa da floresta.", "Um tratado internacional."],
                correta: 1 // B
            },
            {
                materia: "Atualidades",
                pergunta: "Qual foi o principal objetivo da construção da Rodovia Transamazônica?",
                opcoes: ["Facilitar o turismo.", "Integrar a região Norte ao restante do país.", "Preservar a floresta.", "Criar reservas indígenas.", "Diminuir o desmatamento."],
                correta: 1 // B
            },
            {
                materia: "Atualidades",
                pergunta: "O que são os 'rios voadores'?",
                opcoes: ["Rios subterrâneos da Amazônia.", "Fluxos aéreos de vapor d'água que levam chuvas a outras regiões.", "Correntes marítimas do Atlântico.", "Ventos que trazem chuvas ácidas.", "Nuvens carregadas que só chovem na Amazônia."],
                correta: 1 // B
            },
            {
                materia: "Atualidades",
                pergunta: "Quem foi Chico Mendes?",
                opcoes: ["Um político que incentivou o desmatamento.", "Um seringueiro e ativista que lutou pela preservação da floresta.", "Um cientista que descobriu a cura da malária.", "Um empresário da borracha.", "Um líder indígena."],
                correta: 1 // B
            },
            {
                materia: "Atualidades",
                pergunta: "O que é a Amazônia Azul?",
                opcoes: ["Uma área de floresta inundada.", "A área oceânica brasileira com 4,5 milhões de km².", "Um rio da Amazônia.", "Uma reserva indígena.", "Um parque nacional."],
                correta: 1 // B
            },

            // ===== QUÍMICA (5 QUESTÕES) =====
            {
                materia: "Química",
                pergunta: "Qual é a fórmula química do carbonato de cálcio?",
                opcoes: ["CaO", "Na₂O", "CaC₂", "CaCO₃", "NaC₂"],
                correta: 3 // D
            },
            {
                materia: "Química",
                pergunta: "Qual é o principal componente do óleo essencial do cravo-da-índia?",
                opcoes: ["Vanilina", "Eugenol", "Mentol", "Limoneno", "Cânfora"],
                correta: 1 // B
            },
            {
                materia: "Química",
                pergunta: "Qual é o processo de separação de misturas utilizado para extrair o eugenol do cravo-da-índia?",
                opcoes: ["Filtração", "Decantação", "Destilação por arraste a vapor", "Sublimação", "Centrifugação"],
                correta: 2 // C
            },
            {
                materia: "Química",
                pergunta: "Qual é a principal diferença entre o eugenol (C₁₀H₁₂O₂) e a vanilina (C₈H₈O₃)?",
                opcoes: ["O eugenol tem mais carbonos e menos oxigênios.", "A vanilina tem mais carbonos.", "São isômeros.", "Têm a mesma fórmula molecular.", "O eugenol é inorgânico."],
                correta: 0 // A
            },
            {
                materia: "Química",
                pergunta: "Qual é o gás do efeito estufa que equivale a 21 créditos de carbono por tonelada?",
                opcoes: ["CO₂", "CH₄", "N₂O", "O₃", "CFC"],
                correta: 1 // B
            }
        ];

        // ==========================================
        // RENDERIZAÇÃO DA PROVA
        // ==========================================
        function renderProva() {
            const form = document.getElementById('quizForm');
            form.innerHTML = '';

            // Embaralha as questões para cada tentativa
            const questoesEmbaralhadas = [...questoes].sort(() => Math.random() - 0.5);

            // Seleciona 20 de Mat, 20 de Port, 10 de Ciências, 5 de Atualidades, 5 de Química
            const mat = questoesEmbaralhadas.filter(q => q.materia === "Matemática").slice(0, 20);
            const port = questoesEmbaralhadas.filter(q => q.materia === "Português").slice(0, 20);
            const cien = questoesEmbaralhadas.filter(q => q.materia === "Ciências").slice(0, 10);
            const atua = questoesEmbaralhadas.filter(q => q.materia === "Atualidades").slice(0, 5);
            const quim = questoesEmbaralhadas.filter(q => q.materia === "Química").slice(0, 5);

            // Junta e embaralha novamente para a prova final
            const provaFinal = [...mat, ...port, ...cien, ...atua, ...quim].sort(() => Math.random() - 0.5);

            provaFinal.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                
                let optionsHTML = '';
                const letras = ['A', 'B', 'C', 'D', 'E'];
                q.opcoes.forEach((opt, i) => {
                    optionsHTML += `
                        <label>
                            <input type="radio" name="q${index}" value="${i}">
                            <span><strong>${letras[i]})</strong> ${opt}</span>
                        </label>
                    `;
                });

                questionDiv.innerHTML = `
                    <p><span class="question-number">${index + 1}</span> <em style="color: var(--accent); font-size: 0.8rem;">[${q.materia}]</em> ${q.pergunta}</p>
                    <div class="options">
                        ${optionsHTML}
                    </div>
                `;
                
                form.appendChild(questionDiv);
            });

            // Armazena o gabarito no elemento form
            form.dataset.gabarito = JSON.stringify(provaFinal.map(q => q.correta));

            // Adiciona botão de envio
            const submitBtn = document.createElement('button');
            submitBtn.type = 'button';
            submitBtn.className = 'btn-submit';
            submitBtn.textContent = 'ENVIAR RESPOSTAS';
            submitBtn.onclick = evaluateQuiz;
            form.appendChild(submitBtn);
        }

        // ==========================================
        // AVALIAÇÃO
        // ==========================================
        function evaluateQuiz() {
            const form = document.getElementById('quizForm');
            const gabarito = JSON.parse(form.dataset.gabarito);
            const total = gabarito.length;
            let score = 0;
            let naoRespondidas = 0;

            for (let i = 0; i < total; i++) {
                const selected = form.querySelector(`input[name="q${i}"]:checked`);
                if (!selected) {
                    naoRespondidas++;
                    continue;
                }
                if (parseInt(selected.value) === gabarito[i]) {
                    score++;
                }
            }

            const resultBox = document.getElementById('result-box');
            const resultTitle = document.getElementById('result-title');
            const scoreText = document.getElementById('score-text');
            const feedbackText = document.getElementById('feedback-text');

            resultBox.style.display = 'block';
            resultBox.className = '';

            const porcentagem = Math.round((score / total) * 100);
            scoreText.textContent = `${score} / ${total}`;

            let mensagem = '';
            if (naoRespondidas > 0) {
                mensagem = `Você deixou ${naoRespondidas} questão(ões) em branco. `;
            }

            if (porcentagem >= 70) {
                resultBox.classList.add('pass');
                resultTitle.textContent = '🎉 Excelente!';
                mensagem += 'Você dominou o conteúdo. Continue assim!';
            } else if (porcentagem >= 50) {
                resultBox.classList.add('pass');
                resultTitle.textContent = '👍 Bom trabalho!';
                mensagem += 'Você está no caminho certo, mas pode melhorar com mais estudo.';
            } else {
                resultBox.classList.add('fail');
                resultTitle.textContent = '📚 Continue estudando!';
                mensagem += 'Recomendo revisar as aulas e tentar novamente.';
            }

            feedbackText.textContent = mensagem;
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ==========================================
        // RESET
        // ==========================================
        function resetQuiz() {
            const form = document.getElementById('quizForm');
            form.reset();
            document.getElementById('result-box').style.display = 'none';
            renderProva(); // Re-renderiza com novas questões embaralhadas
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ==========================================
        // INICIALIZAÇÃO
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            renderProva();
        });
    </script>
</body>
